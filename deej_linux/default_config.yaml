# deej-linux config. Same format as upstream deej's config.yaml, plus a few extras.
# Changes are picked up automatically while deej-linux is running.

# Slider index -> target, or a list of targets.
# Special targets: master (default output), mic (default input),
#                  system (system/notification sounds),
#                  deej.games (Proton/Wine games, games launched by Steam, and native games that
#                              tag their audio as a game),
#                  deej.unmapped (every app not mapped to any slider).
# App names match the process binary or application name, case-insensitive.
# List what's currently playing with:  deej-linux --list-apps
slider_mapping:
  0: master
  1:
    - firefox
    - chromium
    - chrome
    - vivaldi
  2: spotify
  3:
    - discord
    - vesktop
  4: mic
  5: deej.unmapped

# Flip if your pots run the "wrong" way.
invert_sliders: false

# Serial port of the board. /dev/serial/by-id/... paths stay stable across replugs;
# find yours with:  ls /dev/serial/by-id/
com_port: /dev/ttyACM0
baud_rate: 9600

# Ignore changes smaller than this (pot jitter): low, default, high, or a fraction like 0.01.
noise_reduction: default

# --- deej-linux extras ---
# Snap to exactly 0 % / 100 % when within this fraction of either end.
snap: 0.02
# Seconds between re-applying all levels, so newly started apps pick them up.
reapply_every: 2.0
# Volume curve: volume = slider position ^ volume_curve.
#   1.0 = linear (off, like upstream deej)
#   0.5 = slider at 50 % gives 71 % volume, at 25 % gives 50 %
#   lower = stronger boost of the lower slider range (allowed: 0.1 to 3)
# PipeWire/PulseAudio percentages are already cubic (50 % is about -18 dB), so linear
# leaves the lower half of the slider very quiet.
volume_curve: 1.0
