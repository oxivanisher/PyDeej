[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deej-linux"
dynamic = ["version"]
description = "deej hardware volume mixer client for Linux (PipeWire / PulseAudio)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "pulsectl>=24.0", "PyYAML>=6.0"]

[project.scripts]
deej-linux = "deej_linux.app:main"

[tool.setuptools]
packages = ["deej_linux"]

[tool.setuptools.dynamic]
version = { attr = "deej_linux.__version__" }

[tool.setuptools.package-data]
deej_linux = ["default_config.yaml"]

[project.urls]
Homepage = "https://github.com/oxivanisher/PyDeej"
